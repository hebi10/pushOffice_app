name: DEX-02 Push Office release pilot

on:
  push:
    branches: [codex/dex02-push-office-qa]

permissions:
  contents: read

jobs:
  release-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            sha: c7cc035e78a88401499f3c7226d31bcf6f389a2d
          - name: optimized
            sha: 1b2e2e16a982d7a9f3b4ce689a4dae268130f8cb
    name: Push Office release (${{ matrix.name }})
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      PHASE: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Verify release optimization generated by clean prebuild
        if: matrix.name == 'optimized'
        run: |
          grep -Fx 'android.enableMinifyInReleaseBuilds=true' android/gradle.properties
          grep -Fx 'android.enableShrinkResourcesInReleaseBuilds=true' android/gradle.properties
          grep -F 'proguard-android-optimize.txt' android/app/build.gradle
          grep -F "classpath('com.android.tools:r8:9.1.29')" android/settings.gradle
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/push-office/gradle-8.14.3-bin.zip
          key: push-office-gradle-8.14.3-bd711022-v1
      - run: bash .github/ci/bootstrap-gradle.sh
      - name: Build the x86_64 release APK and AAB with the generated QA signing
        working-directory: android
        run: |
          bash ../.github/ci/retry-gradle-resolution.sh ./gradlew -I ../.github/ci/kotlin-compiler-mirror.init.gradle :app:assembleRelease :app:bundleRelease \
            --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' \
            -Pkotlin.compiler.execution.strategy=in-process -PreactNativeArchitectures=x86_64
      - name: Verify DEX compiler, mapping, and before/after metrics
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import zipfile

          app = Path('android/app/build/outputs')
          bundle = app/'bundle/release/app-release.aab'
          mapping = app/'mapping/release/mapping.txt'
          phase = os.environ['PHASE']
          with zipfile.ZipFile(bundle) as archive:
              dex = [item for item in archive.infolist() if re.fullmatch(r'base/dex/classes[0-9]*\.dex', item.filename)]
              assert dex, 'The release AAB has no base DEX entries.'
              compilers = set()
              for item in dex:
                  for match in re.finditer(rb'~~(D8|R8)(\{[^\x00]{0,2048}\})', archive.read(item)):
                      try:
                          version = json.JSONDecoder().raw_decode(match[2].decode('utf-8', errors='ignore'))[0].get('version')
                          if version:
                              compilers.add((match[1].decode(), version))
                      except json.JSONDecodeError:
                          continue
              if phase == 'optimized':
                  assert ('R8', '9.1.29') in compilers, compilers
                  assert mapping.is_file() and mapping.stat().st_size > 0, 'Missing R8 mapping.'
                  assert 'com.android.tools.build.obfuscation/proguard.map' in '\n'.join(archive.namelist()), 'The release bundle lacks the R8 mapping.'
              elif phase == 'baseline':
                  assert any(name == 'D8' for name, _ in compilers), compilers
              report = {
                  'phase': phase,
                  'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'variant': 'release',
                  'abi': 'x86_64',
                  'compiler_markers': sorted(compilers),
                  'dex_entries': len(dex),
                  'dex_bytes': sum(item.file_size for item in dex),
                  'bundle_bytes': bundle.stat().st_size,
                  'bundle_sha256': hashlib.sha256(bundle.read_bytes()).hexdigest(),
                  'mapping_bytes': mapping.stat().st_size if mapping.is_file() else 0,
              }
          output = json.dumps(report, indent=2)
          Path('dex-pilot.json').write_text(output + '\n', encoding='utf-8')
          print(output)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('```json\n' + output + '\n```\n')
          PY
      - name: Enable runner KVM
        if: matrix.name == 'optimized'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install optimized release and exercise schedule entry and relaunch
        if: matrix.name == 'optimized'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Asia/Seoul
          disable-animations: true
          script: bash tools/ui/install_and_capture.sh && python3 tools/ui/verify_captures.py
      - name: Store pilot measurements and available mapping and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-office-${{ matrix.name }}-dex-pilot
          path: |
            dex-pilot.json
            android/app/build/outputs/mapping/release/mapping.txt
            ui-captures/
          if-no-files-found: warn
          retention-days: 7
