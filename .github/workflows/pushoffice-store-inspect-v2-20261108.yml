name: Push Office Play Store listing inspection v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pushoffice-store-inspect-v2-20261108.yml'

permissions:
  contents: read
  id-token: write

jobs:
  inspection:
    if: >-
      github.repository == 'hebi10/pushOffice_app' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[push-office-store-inspect-v2-20261108]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate existing Play service account
        uses: google-github-actions/auth@v3
        id: auth
        with:
          project_id: hebi-app-release-80847404
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Inspect existing ko-KR listing and assets (no writes)
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 .github/ops/play_store_inspect.py
      - name: Keep inspection result for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PushOffice-store-inspection-v2
          path: ${{ runner.temp }}/push-office-store-inspection.json
          retention-days: 14
          if-no-files-found: warn
