name: Push Office widget emulator QA

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/push-office-native/**"
      - ".github/workflows/widget-emulator-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-office-widget-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  widget-instrumentation:
    name: Android widget layout instrumentation (API 29)
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Prepare software-emulator KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real RemoteViews widget layouts and entry intents in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd android
            ./gradlew :push-office-native:connectedDebugAndroidTest \
              --no-daemon --max-workers=2 \
              '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' \
              -Pkotlin.compiler.execution.strategy=in-process \
              -PreactNativeArchitectures=x86_64 \
              -Pandroid.testInstrumentationRunnerArguments.class=expo.modules.pushoffice.ScheduleWidgetViewsTest
      - name: Keep widget instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PushOffice-widget-emulator-qa
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
