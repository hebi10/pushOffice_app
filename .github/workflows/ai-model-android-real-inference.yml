name: Push Office four real LiteRT models on Android emulator
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ai-model-android-real-inference.yml"
      - "tools/ci/run_android_ai_real_inference.sh"
      - "tools/ci/verify_android_ai_real_report.py"
      - "modules/push-office-native/android/src/androidTest/java/expo/modules/pushoffice/AiModelAndroidRealInferenceTest.kt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: push-office-android-real-models-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android-real-model:
    name: Android real weight/SHA/CPU - ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: qwen3-06
            repo: litert-community/Qwen3-0.6B
            file: Qwen3-0.6B.litertlm
          - id: qwen35-08
            repo: litert-community/Qwen3.5-0.8B
            file: Qwen3.5-0.8B_int8.litertlm
          - id: qwen35-2
            repo: litert-community/Qwen3.5-2B
            file: Qwen3.5-2B_int8.litertlm
          - id: gemma4-e2b
            repo: litert-community/gemma-4-E2B-it-litert-lm
            file: gemma-4-E2B-it.litertlm
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Download real pinned model bytes and verify host file SHA-256
        run: |
          python -m pip install "huggingface_hub[hf_xet]>=0.34,<2"
          python tools/ci/verify_litert_remote.py metadata
          mkdir -p actual-model
          hf download "${{ matrix.repo }}" "${{ matrix.file }}" --local-dir actual-model
          python tools/ci/verify_litert_remote.py digest "${{ matrix.id }}" "actual-model/${{ matrix.file }}"
      - run: npx --no-install expo prebuild --platform android --clean --no-install
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/push-office/gradle-8.14.3-bin.zip
          key: push-office-gradle-8.14.3-bd711022-v1
      - run: bash .github/ci/bootstrap-gradle.sh
      - name: Enable GitHub Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stage true model weights and run native LiteRT-LM on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 6144 -partition-size 8192
          disable-animations: true
          script: bash tools/ci/run_android_ai_real_inference.sh "${{ matrix.id }}" "actual-model/${{ matrix.file }}"
      - name: Keep model-level Android results (never upload weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PushOffice-Android-Real-${{ matrix.id }}
          path: |
            model-head-evidence.json
            model-full-sha.json
            android-ai-real/
            android/**/build/reports/androidTests/connected/**
            android/**/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
