name: Push Office UI screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "modules/**"
      - "assets/images/**"
      - "tools/ui/**"
      - ".github/workflows/ui-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: push-office-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.repository == 'hebi10/pushOffice_app'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Restore checksum-verified Gradle distribution cache
        id: gradle-zip-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/push-office/gradle-8.14.3-bin.zip
          key: push-office-gradle-8.14.3-bd711022-v1
      - name: Bootstrap Gradle 8.14.3 from verified mirrors
        run: bash .github/ci/bootstrap-gradle.sh
      - name: Save verified Gradle distribution even when Kotlin compilation later fails
        if: steps.gradle-zip-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/push-office/gradle-8.14.3-bin.zip
          key: push-office-gradle-8.14.3-bd711022-v1
      - name: Build emulator-installable app with bundled JS
        working-directory: android
        run: |
          ./gradlew -I ../.github/ci/kotlin-compiler-mirror.init.gradle :app:assembleRelease --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PreactNativeArchitectures=x86_64
      - name: Prepare software-emulator KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and capture actual app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/ui/install_and_capture.sh
      - name: Verify all required UI captures and reject warnings
        run: python3 tools/ui/verify_captures.py
      - name: Preserve screenshots and capture details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PushOffice-UI-screenshots
          path: ui-captures/
          if-no-files-found: warn
          retention-days: 14
