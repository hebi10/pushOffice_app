name: Push Office external briefing security

on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/features/digest/**'
      - 'firestore.rules'
      - 'tests/po-sec-01-external-briefing.test.mjs'
      - '.github/workflows/po-briefing-security.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/features/digest/**'
      - 'firestore.rules'
      - 'tests/po-sec-01-external-briefing.test.mjs'
      - '.github/workflows/po-briefing-security.yml'

permissions:
  contents: read

jobs:
  offline-backend:
    name: Offline Firebase Functions compile and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - run: npm --prefix functions test
