name: Push Office Mono Office native instrumentation

on:
  workflow_call:
    inputs:
      expected_main_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact frozen main revision for full Android device QA'
        type: string
        required: true
permissions:
  contents: read

concurrency:
  group: mono-office-native-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Require exact final main SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Reject stale or non-main device QA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Final QA is main-only"; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_MAIN_SHA" == "$GITHUB_SHA" ]] || { echo "::error::Final SHA mismatch"; exit 1; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]] || { echo "::error::main moved since QA started"; exit 1; }

  native-instrumentation:
    needs: validate-source
    name: Android API 29 widget and quick-entry instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Restore checksum-verified Gradle distribution cache
        id: gradle-zip-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/push-office/gradle-8.14.3-bin.zip
          key: push-office-gradle-8.14.3-bd711022-v1
      - name: Bootstrap Gradle from verified mirrors
        run: bash .github/ci/bootstrap-gradle.sh
      - name: Cache verified Gradle distribution
        if: steps.gradle-zip-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/push-office/gradle-8.14.3-bin.zip
          key: push-office-gradle-8.14.3-bd711022-v1
      - name: Set up emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android widget/quick-entry tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/ui/run_mono_office_native_qa.sh
      - name: Keep Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PushOffice-MonoOffice-native-instrumentation
          path: |
            android/**/build/reports/androidTests/connected/**
            android/**/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
