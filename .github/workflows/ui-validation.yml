name: Push Office UI validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: push-office-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  javascript:
    name: React Native UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx --no-install eslint app src plugins tests
      - run: npx --no-install expo export --platform android --output-dir dist-ui-check

  native:
    name: Android Kotlin UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Extend short Gradle wrapper network timeout for CI
        run: |
          wrapper=android/gradle/wrapper/gradle-wrapper.properties
          test -f "$wrapper"
          if grep -q '^networkTimeout=' "$wrapper"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$wrapper"
          else
            printf '\nnetworkTimeout=120000\n' >> "$wrapper"
          fi
      - name: Test and compile Android module
        working-directory: android
        run: |
          ./gradlew :push-office-native:testDebugUnitTest :app:assembleDebug \
            --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PreactNativeArchitectures=x86_64
