name: Push Office UI validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: push-office-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  javascript:
    name: React Native UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx --no-install eslint app src plugins tests
      - run: npx --no-install expo export --platform android --output-dir dist-ui-check

  native:
    name: Android Kotlin UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Restore checksum-verified Gradle distribution cache
        id: gradle-zip-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/push-office/gradle-8.14.3-bin.zip
          key: push-office-gradle-8.14.3-bd711022-v1
      - name: Bootstrap Gradle 8.14.3 from verified mirrors
        run: bash .github/ci/bootstrap-gradle.sh
      - name: Save verified Gradle distribution even when Kotlin compilation later fails
        if: steps.gradle-zip-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/push-office/gradle-8.14.3-bin.zip
          key: push-office-gradle-8.14.3-bd711022-v1
      - name: Test and compile Android module
        working-directory: android
        run: |
          ./gradlew -I ../.github/ci/kotlin-compiler-mirror.init.gradle :push-office-native:testDebugUnitTest :app:assembleDebug \
            --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PreactNativeArchitectures=x86_64
      - name: Verify NOTI-AI-00 synthetic recognition baseline
        run: python3 tools/qa/verify_noti_ai_00.py
      - name: Preserve NOTI-AI-00 fixture benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PushOffice-NOTI-AI-00-baseline
          path: modules/push-office-native/android/build/reports/noti-ai-00/baseline.json
          if-no-files-found: warn
          retention-days: 30
