name: DEX-02 Push Office pre-R8 compact calendar comparison

on:
  push:
    branches: [codex/dex02-push-office-baseline-compact-qa]

permissions:
  contents: read
  actions: read

jobs:
  baseline-compact-calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c7cc035e78a88401499f3c7226d31bcf6f389a2d
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch the unchanged compact probe without changing the app checkout
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/ci/dex02-compact-probe.py" > "$RUNNER_TEMP/dex02-compact-probe.py"
          test "$(git rev-parse HEAD)" = 'c7cc035e78a88401499f3c7226d31bcf6f389a2d'
      - name: Download the existing pre-R8 Play build
        uses: actions/download-artifact@v4
        with:
          name: PushOffice-build-internal-48-1
          run-id: 45745834134
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline-artifact
      - name: Verify the existing bundle and prepare an isolated test APK
        run: |
          mapfile -d '' bundles < <(find "$RUNNER_TEMP/baseline-artifact" -type f -name '*.aab' -print0)
          [[ "${#bundles[@]}" -eq 1 ]]
          printf '%s  %s\n' 2ff3ea8eccb0af502c7aa20b98b37558ba99ab247d0084e5eca51bb1a15ad0ca "${bundles[0]}" | sha256sum --check
          curl --fail --silent --show-error --location --retry 2 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
          keytool -genkeypair -noprompt -dname 'CN=DEX-02 Disposable Emulator' -keystore "$RUNNER_TEMP/qa.jks" -alias qa -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 2
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="${bundles[0]}" --output="$RUNNER_TEMP/baseline.apks" --mode=universal --ks="$RUNNER_TEMP/qa.jks" --ks-pass=pass:android --ks-key-alias=qa --key-pass=pass:android
          unzip -p "$RUNNER_TEMP/baseline.apks" universal.apk > "$RUNNER_TEMP/baseline.apk"
          test -s "$RUNNER_TEMP/baseline.apk"
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare exact compact selected-day interaction on unoptimized baseline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Asia/Seoul
          disable-animations: true
          script: adb install -r "$RUNNER_TEMP/baseline.apk" && PYTHONPATH="$PWD/tools/ui" python3 "$RUNNER_TEMP/dex02-compact-probe.py"
      - name: Preserve baseline captures and hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-office-pre-r8-compact-calendar-evidence
          path: compact-dex-evidence/
          if-no-files-found: warn
          retention-days: 7
