// CI-only fallback for Kotlin compiler artifacts when Maven Central redirects to unavailable GitHub Releases.
// Regular sources remain configured. This mirror is restricted to the Kotlin compiler group.
def kotlinMirror = 'https://maven.aliyun.com/repository/central'

def addKotlinMirror = { handler ->
    if (handler.findByName('PushOfficeKotlinMirror') == null) {
        handler.maven {
            name = 'PushOfficeKotlinMirror'
            url = uri(kotlinMirror)
            content { includeGroup('org.jetbrains.kotlin') }
        }
    }
}

gradle.allprojects { project ->
    addKotlinMirror(project.buildscript.repositories)
    addKotlinMirror(project.repositories)
}

// React Native's included settings build resolves Foojay and its Gson dependency
// before project repository hooks run. Add only Gson and its two POM parents.
gradle.beforeSettings { settings ->
    if (settings.settingsDir.toPath().endsWith('node_modules/@react-native/gradle-plugin')) {
        settings.pluginManagement.repositories.maven {
            name = 'PushOfficeGsonCentralMirror'
            url = 'https://maven-central.storage-download.googleapis.com/maven2/'
            content {
                includeVersion('com.google.code.gson', 'gson', '2.9.1')
                includeVersion('com.google.code.gson', 'gson-parent', '2.9.1')
                includeVersion('org.sonatype.oss', 'oss-parent', '9')
            }
        }
    }
}
